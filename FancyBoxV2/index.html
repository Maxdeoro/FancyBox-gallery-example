
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FancyBox Gallery</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- FancyBox CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css">
    <!-- FancyBox JS -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js"></script>
</head>
<body>
    <div class="gallery">
        <a href="images/pic1.jpg" data-fancybox="gallery" title="Pic.1">
            <img src="images/pic1small.jpg" alt="Image 1">
        </a>
        <a href="images/pic2.jpg" data-fancybox="gallery" title="Pic.2">
            <img src="images/pic2small.jpg" alt="Image 2">
        </a>
        <a href="images/pic3.jpg" data-fancybox="gallery" title="Pic.3">
            <img src="images/pic3small.jpg" alt="Image 3">
        </a>
		<a href="images/pic4.jpg" data-fancybox="gallery" title="Pic.4">
            <img src="images/pic4small.jpg" alt="Image 4">
        </a>
		<a href="images/pic5.jpg" data-fancybox="gallery" title="Pic.5">
            <img src="images/pic5small.jpg" alt="Image 5">
        </a>
    </div>

	<script src="js/script.js"></script>

</body>
</html>
